name: Claude PR Review

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request') ||
      (contains(github.event.comment.body, '@claude') && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue?.number || context.payload.pull_request?.number,
            });
            const diff = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.data.number,
            });
            const summary = diff.data.map(f =>
              `${f.status} ${f.filename} (+${f.additions}/-${f.deletions})`
            ).join('\n');
            core.setOutput('pr_number', pr.data.number);
            core.setOutput('diff_summary', summary);

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            你是一位经验丰富的代码审查者。请完成以下任务：

            1. 使用 git diff origin/main...HEAD 获取当前分支的完整代码变更
            2. 分析变更内容，从以下维度进行审查：
               - 代码质量与可读性
               - 潜在的 bug 或逻辑问题
               - 安全性风险
               - 性能影响
               - 测试覆盖建议
            3. 将审查结果以结构化的 Markdown 格式，通过 GitHub CLI 或 API 作为 PR 评论发布

            PR 变更摘要：
            ${{ steps.diff.outputs.diff_summary }}
          claude_args: "--max-turns 6"
